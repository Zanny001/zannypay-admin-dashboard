name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Yarn (Corepack)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Tests
        run: yarn test --ci

      - name: Build
        run: yarn build
        env:
          # Build-only value — the real URL is injected by the hosting
          # platform's env config; the app refuses nothing at build time.
          ADMIN_API_BASE_URL: http://localhost:3000
